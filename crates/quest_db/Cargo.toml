[package]
name = "quest_db"
version = "0.1.0"
edition = "2024"

[dependencies]
rusqlite = { version = "0.40", features = ["bundled", "chrono"] }
rusqlite_migration = "2.6"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
