[package]
name = "witcher_wiki"
version = "0.1.0"
edition = "2024"

[dependencies]
reqwest = { version = "0.12", features = ["json"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["time"] }
regex = "1"
companion_db = { path = "../companion_db" }

[features]
# Exposes `mock_scrape_result()` sample data for downstream tests.
mock = []

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
