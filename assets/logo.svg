<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>Witcher 3 Companion</title>
  <defs>
    <radialGradient id="metal" cx="45%" cy="28%" r="78%">
      <stop offset="0" stop-color="#f3dca2"/>
      <stop offset=".4" stop-color="#bf9d5e"/>
      <stop offset=".8" stop-color="#6e5530"/>
      <stop offset="1" stop-color="#3f311c"/>
    </radialGradient>
    <linearGradient id="snout" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6e3b0"/>
      <stop offset="1" stop-color="#a5874e"/>
    </linearGradient>
    <radialGradient id="eye" cx="50%" cy="50%" r="60%">
      <stop offset="0" stop-color="#fff3c8"/>
      <stop offset="1" stop-color="#e0703a"/>
    </radialGradient>
  </defs>
  <!-- chain loop -->
  <circle cx="32" cy="6.5" r="3.4" fill="none" stroke="#1a140c" stroke-width="3"/>
  <circle cx="32" cy="6.5" r="3.4" fill="none" stroke="#c9a45c" stroke-width="1.5"/>
  <!-- head: tall ears, spiky ruff, long muzzle -->
  <path id="head" fill="url(#metal)" stroke="#1a140c" stroke-width="1.4" stroke-linejoin="round"
    d="M32 13.5 L25 10 L15 1.5 L13.5 16 L8 21 L10.5 27 L4.5 31.5 L10 36 L7.5 42.5 L15 43 L18 50 L24 49 L32 62.5 L40 49 L46 50 L49 43 L56.5 42.5 L54 36 L59.5 31.5 L53.5 27 L56 21 L50.5 16 L49 1.5 L39 10 Z"/>
  <!-- bevelled rim -->
  <path fill="none" stroke="#f6e3b0" stroke-opacity=".45" stroke-width=".9" stroke-linejoin="round"
    transform="translate(32 32) scale(.88) translate(-32 -32)"
    d="M32 13.5 L25 10 L15 1.5 L13.5 16 L8 21 L10.5 27 L4.5 31.5 L10 36 L7.5 42.5 L15 43 L18 50 L24 49 L32 62.5 L40 49 L46 50 L49 43 L56.5 42.5 L54 36 L59.5 31.5 L53.5 27 L56 21 L50.5 16 L49 1.5 L39 10 Z"/>
  <!-- inner ears -->
  <path d="M16.5 6 L18.3 15 L23.5 11.3 Z M47.5 6 L45.7 15 L40.5 11.3 Z" fill="#2a2014" fill-opacity=".75"/>
  <g fill="none" stroke="#2a2014" stroke-linecap="round" stroke-linejoin="round">
    <!-- fur of the ruff -->
    <path d="M11 23.5 L17 27 M9 31.5 L16 32.5 M11.5 39.5 L17.5 38 M53 23.5 L47 27 M55 31.5 L48 32.5 M52.5 39.5 L46.5 38" stroke-width="1.2"/>
    <!-- forehead grooves -->
    <path d="M32 15 V20.5 M27.5 14.5 L30 19.5 M36.5 14.5 L34 19.5" stroke-width="1"/>
  </g>
  <!-- heavy brows -->
  <path d="M19 19.5 L29.5 24.5 L27.5 26.3 Z M45 19.5 L34.5 24.5 L36.5 26.3 Z" fill="#1a140c"/>
  <!-- open jaws with fangs -->
  <path d="M22.5 40.5 L28.5 41 L32 44 L35.5 41 L41.5 40.5 L38 50 Q32 55.5 26 50 Z" fill="#1a140c"/>
  <path d="M24.4 41.2 L26.2 47 L27.8 41.6 Z M39.6 41.2 L37.8 47 L36.2 41.6 Z" fill="#f1e2bf"/>
  <path d="M27.3 51.2 L28.6 46.8 L30 51.9 Z M36.7 51.2 L35.4 46.8 L34 51.9 Z" fill="#d9c7a0"/>
  <!-- raised snout plate and nose -->
  <path d="M32 21.5 L37.5 27.5 L38.5 36 L35.3 41.3 L28.7 41.3 L25.5 36 L26.5 27.5 Z" fill="url(#snout)" stroke="#1a140c" stroke-width="1" stroke-linejoin="round"/>
  <path d="M32 24.5 V34" stroke="#8a6c35" stroke-width=".9" stroke-linecap="round"/>
  <path d="M28.6 37.2 Q32 35.8 35.4 37.2 L32 41.2 Z" fill="#1a140c"/>
  <!-- eyes -->
  <g class="medallion-sign" fill="url(#eye)" stroke="#1a140c" stroke-width=".6">
    <path d="M21 24.2 L27.6 26.6 L23 28.4 Z"/>
    <path d="M43 24.2 L36.4 26.6 L41 28.4 Z"/>
  </g>
</svg>
