[workspace]
members = [".", "crates/companion_db", "crates/witcher_wiki", "crates/w3_formats"]
resolver = "2"

[package]
name = "witcher_3_companion"
version = "0.4.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"
dioxus = { version = "0.7", features = ["desktop"] }
dirs = "7.0.0"
notify = "8.2.0"
open = "5.4.4"
companion_db = { path = "crates/companion_db" }
witcher_wiki = { version = "0.1.0", path = "crates/witcher_wiki" }
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.2", features = ["rt", "sync", "time"] }
toml = "1.1.6"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
w3_formats = { version = "0.1.0", path = "crates/w3_formats" }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
unicode-normalization = "0.1"
sys-locale = "0.3.2"

[dev-dependencies]
witcher_wiki = { path = "crates/witcher_wiki", features = ["mock"] }
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread"] }

[build-dependencies]
winresource = "0.1.31"
