[workspace]
members = [".", "crates/quest_db", "crates/quest_scraper", "crates/w3_formats"]
resolver = "2"

[package]
name = "witcher_3_quest_tracker"
version = "0.2.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"
dioxus = { version = "0.7", features = ["desktop"] }
dirs = "7.0.0"
notify = "8.2.0"
open = "5.4.4"
quest_db = { path = "crates/quest_db" }
quest_scraper = { version = "0.1.0", path = "crates/quest_scraper" }
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.2", features = ["rt", "sync", "time"] }
toml = "1.1.6"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
w3_formats = { version = "0.1.0", path = "crates/w3_formats" }

[dev-dependencies]
quest_scraper = { path = "crates/quest_scraper", features = ["mock"] }
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread"] }
