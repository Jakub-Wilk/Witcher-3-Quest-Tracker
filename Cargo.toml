[workspace]
members = [".", "crates/quest_db", "crates/quest_scraper"]
resolver = "2"

[package]
name = "witcher_3_quest_tracker"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"
dioxus = { version = "0.7", features = ["desktop"] }
dirs = "7.0.0"
open = "5.4.4"
quest_db = { path = "crates/quest_db" }
quest_scraper = { version = "0.1.0", path = "crates/quest_scraper" }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.6"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[dev-dependencies]
quest_scraper = { path = "crates/quest_scraper", features = ["mock"] }
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread"] }
