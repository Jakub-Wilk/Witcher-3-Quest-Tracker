name: Release

# A merged pull request lands on the branch as a push, so the push trigger
# covers both direct pushes and merged PRs without releasing twice.
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Compute version
        id: version
        run: |
          base=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "witcher_3_quest_tracker") | .version')
          stamp=$(date -u +%Y%m%d%H%M%S)
          version="${base}.${stamp}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Release version: ${version}"

      - name: Build release
        run: cargo build --release --locked -p witcher_3_quest_tracker

      - name: Package
        run: |
          name="witcher_3_quest_tracker-${{ steps.version.outputs.version }}-windows-x64"
          mkdir -p dist
          cp target/release/witcher_3_quest_tracker.exe "dist/${name}.exe"
          cp LICENSE dist/
          (cd dist && 7z a "../${name}.zip" .)
          echo "ARCHIVE=${name}.zip" >> "$GITHUB_ENV"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.version.outputs.version }}"
          gh release create "v${version}" "${ARCHIVE}" \
            --target "${GITHUB_SHA}" \
            --title "v${version}" \
            --generate-notes
